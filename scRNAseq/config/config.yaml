# 配置文件
samples:
  - sample1
  - sample2

data_dir: "data"
output_dir: "results"

qc:
  min_genes_per_cell: 200
  max_genes_per_cell: 2500
  max_mito_percent: 5
  min_cells_per_gene: 3

normalization:
  n_top_genes: 2000

dim_reduction:
  n_pcs: 50

clustering:
  n_neighbors: 15
  resolution: 0.5

marker_genes:
  n_top_markers_per_cluster: 10
  min_logfc: 0.5

random_seed: 42